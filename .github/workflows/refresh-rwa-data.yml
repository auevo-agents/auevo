name: Refresh RWA data

# Vercel's Hobby plan (this project's actual plan) hard-rejects any cron
# entry in vercel.json more frequent than once a day — see run-prices.ts's
# own doc comment for how that was discovered. This workflow is the free
# workaround: it hits the same cron routes on GitHub Actions' own
# scheduler instead, so prices/registry/risk/alerts refresh hourly instead
# of once a day, at no cost. vercel.json's daily crons are left in place
# as a safety net in case this workflow is ever paused or disabled — the
# routes are idempotent/checkpointed, so an extra daily call costs nothing.
#
# Budget check: this repo is private, so GitHub Actions' free tier is
# 2,000 minutes/month. Five sequential calls per run, hourly, is 720
# runs/month — comfortably inside budget even if each run takes a couple
# of minutes. If GitHub ever did exhaust the free minutes, the schedule
# just stops firing (no spending limit is set), it does not silently bill
# anyone — see the repo's Settings → Billing if that ever needs raising.
#
# If prices alone need to be fresher than this (e.g. every 5–15 minutes),
# that's the point where Vercel Pro (which also lifts the maxDuration
# ceiling every pass here is currently budgeted around) becomes the
# simpler answer instead of tuning this further.
#
# Setup (one-time): add a repository secret named CRON_SECRET (Settings →
# Secrets and variables → Actions → New repository secret) with the exact
# same value already set as CRON_SECRET in the Vercel project's env vars —
# these routes reject any other value with 401.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

env:
  BASE_URL: ${{ vars.APP_BASE_URL || 'https://auevo.io' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: rwa-prices
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/rwa-prices"

      - name: rwa-registry
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/rwa-registry"

      - name: rwa-risk
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/rwa-risk"

      - name: rwa-alerts
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/rwa-alerts"

      - name: index-chain
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/index-chain"
